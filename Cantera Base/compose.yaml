# The database and the API together:  docker compose up --build
# Just the database (then run the API from VS Code):  docker compose up -d db
services:
  db:
    image: mysql:8.4
    container_name: csc280-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass      # fine for class; never do this in production
      - MYSQL_DATABASE=diary
      - MYSQL_USER=diary
      - MYSQL_PASSWORD=diarypass
      - TZ=America/Denver
    ports:
      - "3307:3306"
    volumes:
      - diary-data:/var/lib/mysql
    healthcheck:                          # "healthy" = MySQL is really ready for connections
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-udiary", "-pdiarypass"]
      interval: 5s
      retries: 20

  app:
    build: .
    container_name: csc280-e3-3
    depends_on:
      db:
        condition: service_healthy        # don't start the API until MySQL is ready
    environment:
      - TZ=America/Denver
      # Inside Docker the database's address is its service name, "db", not localhost
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/diary
    ports:
      - "8080:8080"

volumes:
  diary-data:
