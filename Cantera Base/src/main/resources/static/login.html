<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ReTap - Login</title>
        <link rel="stylesheet" href="/css/style.css">
        <script src="/js/auth.js" defer></script>

    </head>

    <body>
        <div class="site-ticker">
            <marquee scrollamount="5">
                *** HELLO CHUDS ***
            </marquee>
        </div>
        <div class="container">
            
            <header>
                <h1>ReTap</h1>
                <h3>Player Login</h3>
            </header>

            <main>
                <h2>something profound</h2>
                <div class="form-container">
                    <section class="form-box">
                        <h2>log in</h2>
                            <form id="login-form">
                            <label for="login-email">Email:</label>
                            <input type="email" id="login-email" name="email" autocomplete="email" required>
                            
                            <label for="login-password">Password:</label>
                            <input type="password" id="login-password" name="password" autocomplete="current-password" required>

                            <button type="submit" class="retro-button">
                                log in
                            </button>
                        </form>
                    </section>

                    <section class="form-box">
                        <h2>REGISTER</h2>

                        <form id="login-form">
                            <label for="register-username">Username:</label>
                            <input type="text" id="register-username" name="username" autocomplete="username" required>

                            <label for="register-email">Email:</label>
                            <input type="email" id="register-email" name="email" autocomplete="email" required>

                            <label for="register-password">Password:</label>
                            <input type="password" id="register-password" name="password" minlength="8" autocomplete="new-password" required>

                            <label for="confirm-password">Confirm Password:</label>
                            <input type="password" id="confirm-password" name="confirmPassword" minlength="8" autocomplete="new-password" required>

                            <button type="submit" class="retro-button">
                                REGISTER
                            </button>
                        </form>
                    </section>
                </div>

                <p class="link"><a  href="/">RETURN TO MAIN PAGE</a></p>
            </main>
            <footer>
                <p>ReTap</p>
                <p>©RawMilkClub - 2026</p>
            </footer>
        </div>
    </body>
</html>
