spring.application.name=dear-diary
server.port=8080

# Where the database is and how to log in (matches compose.yaml)
spring.datasource.url=jdbc:mysql://localhost:3306/diary
spring.datasource.username=diary
spring.datasource.password=diarypass

# update = create or change tables to match the @Entity classes (fine for class, not production)
spring.jpa.hibernate.ddl-auto=update
# Print every SQL statement Hibernate runs, so you can see what your repository did
spring.jpa.show-sql=true
# Close the database connection when the request leaves the controller (recommended)
spring.jpa.open-in-view=false
